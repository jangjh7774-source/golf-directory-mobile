<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>중부·강원권 골프장 304개소 모바일 디렉토리 (읽기 전용)</title>
<style>
  :root {
    --bg: #0b1120;
    --header-bg: rgba(15, 23, 42, 0.96);
    --card: #162033;
    --card-active: #1e293b;
    --border: #283548;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #22c55e;
    --warn: #f59e0b;
    --danger: #f43f5e;
    --purple: #a78bfa;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.45;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
  }
  button, select, input, textarea, a {
    font-family: inherit;
    touch-action: manipulation;
  }

  /* 앱 전체 컨테이너 (모바일 중심, 태블릿/PC에서도 중앙 정렬된 모바일 뷰 제공) */
  .app-shell {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  /* 1. 상단 고정 영역: 타이틀 + 검색창 + 권역별 클릭창 */
  .sticky-top {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 14px 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .top-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .top-title-row h1 {
    font-size: 16.5px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .total-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.16);
    color: #7dd3fc;
    border: 1px solid rgba(56, 189, 248, 0.35);
  }
  .top-mini-actions {
    display: flex;
    gap: 5px;
  }
  .mini-btn {
    border: 1px solid var(--border);
    background: #1e293b;
    color: #e2e8f0;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .mini-btn.accent {
    background: var(--accent);
    border-color: var(--accent);
    color: #062133;
  }
  .mini-btn.green {
    background: var(--accent-2);
    border-color: var(--accent-2);
    color: #052e16;
  }


  /* 데이터 소스 상태 배너 (실시간 / 로컬 폴백 표시) */
  .data-status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid var(--border);
    background: #111c30;
    color: #cbd5e1;
    transition: all 0.2s ease;
  }
  .data-status-bar.loading {
    border-color: rgba(56, 189, 248, 0.45);
    background: rgba(56, 189, 248, 0.12);
    color: #7dd3fc;
  }
  .data-status-bar.live {
    border-color: rgba(34, 197, 94, 0.5);
    background: rgba(34, 197, 94, 0.14);
    color: #86efac;
  }
  .data-status-bar.local {
    border-color: rgba(245, 158, 11, 0.5);
    background: rgba(245, 158, 11, 0.14);
    color: #fcd34d;
  }
  .status-left {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #94a3b8;
  }
  .data-status-bar.loading .status-dot {
    background: #38bdf8;
    box-shadow: 0 0 8px #38bdf8;
  }
  .data-status-bar.live .status-dot {
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
  }
  .data-status-bar.local .status-dot {
    background: #f59e0b;
    box-shadow: 0 0 8px #f59e0b;
  }
  .status-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-sub {
    font-size: 10.5px;
    font-weight: 600;
    opacity: 0.85;
    margin-left: 4px;
  }
  .sync-btn {
    flex-shrink: 0;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(15, 23, 42, 0.65);
    color: #f8fafc;
    border-radius: 7px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .sync-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  /* 검색창 (iOS 자동 줌 방지 16px 폰트 적용) */
  .search-wrap {
    position: relative;
    width: 100%;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 15px;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    background: #090e1a;
    border: 1.5px solid #334155;
    color: #ffffff;
    border-radius: 12px;
    padding: 10px 38px 10px 36px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search-input::placeholder {
    color: #64748b;
    font-size: 14px;
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
  }
  .search-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: #334155;
    color: #f8fafc;
    font-size: 13px;
    font-weight: 700;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .search-clear.show {
    display: flex;
  }

  /* 2. 권역별 클릭창 (큰 터치 버튼 그리드/가로 스크롤) */
  .region-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .region-btn {
    border: 1px solid var(--border);
    background: #162033;
    color: #cbd5e1;
    border-radius: 10px;
    padding: 8px 6px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all 0.14s ease;
  }
  .region-btn .cnt {
    font-size: 11px;
    font-weight: 600;
    opacity: 0.85;
  }
  .region-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #061826;
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.28);
  }

  /* 세부 필터 & 정렬 바 */
  .sub-filter-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .sub-filter-bar::-webkit-scrollbar { display: none; }
  .sub-select {
    flex: 1;
    min-width: 115px;
    background: #0f172a;
    border: 1px solid var(--border);
    color: #e2e8f0;
    border-radius: 9px;
    padding: 7px 8px;
    font-size: 13px;
    font-weight: 600;
    outline: none;
  }
  .sort-btn {
    flex-shrink: 0;
    background: #0f172a;
    border: 1px solid var(--border);
    color: #cbd5e1;
    border-radius: 9px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .sort-btn.active {
    border-color: var(--accent-2);
    color: #86efac;
    background: rgba(34, 197, 94, 0.14);
  }

  /* 결과 요약 & 관리 도구 바 */
  .result-status-bar {
    padding: 9px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    background: #0d1526;
    border-bottom: 1px solid rgba(51, 65, 85, 0.5);
  }
  .result-status-bar strong {
    color: #38bdf8;
    font-weight: 800;
  }

  /* 3. 골프장 304개소 상세 카드 리스트 */
  .course-list {
    padding: 10px 12px 24px 12px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .course-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.24);
    transition: border-color 0.15s ease, transform 0.12s ease;
    cursor: pointer;
  }
  .course-card:active {
    transform: scale(0.992);
  }
  .course-card.highlighted {
    border-color: var(--accent-2);
    box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.35);
    background: #19273c;
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 7px;
  }
  .card-title {
    font-size: 15.5px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.35;
    word-break: keep-all;
  }
  .card-num {
    font-size: 12px;
    font-weight: 700;
    color: #64748b;
    margin-right: 4px;
  }
  .card-caterer {
    color: var(--accent);
    font-weight: 800;
  }
  .card-detail-btn {
    flex-shrink: 0;
    background: rgba(56, 189, 248, 0.14);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #7dd3fc;
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
  }

  /* 배지 태그 */
  .badge-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 9px;
  }
  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: 6px;
    background: rgba(148, 163, 184, 0.14);
    color: #e2e8f0;
  }
  .tag.region {
    background: rgba(56, 189, 248, 0.18);
    color: #7dd3fc;
  }
  .tag.change {
    background: rgba(245, 158, 11, 0.2);
    color: #fcd34d;
  }
  .tag.beer {
    background: rgba(167, 139, 250, 0.2);
    color: #ddd6fe;
  }
  .tag.edited {
    background: rgba(34, 197, 94, 0.22);
    color: #86efac;
  }

  /* 상세 정보 그리드 */
  .info-rows {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12.5px;
    color: #cbd5e1;
  }
  .info-line {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    line-height: 1.45;
  }
  .info-label {
    flex-shrink: 0;
    width: 54px;
    color: var(--muted);
    font-weight: 700;
    font-size: 12px;
  }
  .info-val {
    flex: 1;
    min-width: 0;
    word-break: keep-all;
  }
  .tel-link {
    color: #86efac;
    text-decoration: none;
    font-weight: 700;
  }

  /* 6곳의 인근 골프장 영역 */
  .nearby-box {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px dashed rgba(148, 163, 184, 0.26);
  }
  .nearby-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 800;
    color: #93c5fd;
    margin-bottom: 6px;
  }
  .nearby-head span.sub {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--muted);
  }
  .nearby-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
  }
  .nearby-item {
    background: #0d1526;
    border: 1px solid #263349;
    border-radius: 8px;
    padding: 6px 8px;
    text-align: left;
    color: #f1f5f9;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: border-color 0.14s ease, background 0.14s ease;
  }
  .nearby-item:active {
    background: rgba(56, 189, 248, 0.18);
    border-color: var(--accent);
  }
  .nearby-name-line {
    font-size: 11.5px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nearby-name-line .cat {
    color: #7dd3fc;
    font-weight: 600;
  }
  .nearby-meta-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    font-size: 10.5px;
  }
  .nearby-city {
    color: #94a3b8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .time-pill {
    flex-shrink: 0;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 10px;
  }
  .t-fast { background: rgba(34, 197, 94, 0.22); color: #86efac; }
  .t-mid { background: rgba(56, 189, 248, 0.22); color: #7dd3fc; }
  .t-far { background: rgba(245, 158, 11, 0.22); color: #fcd34d; }

  /* 맨 위로 플로팅 버튼 */
  .scroll-top-btn {
    position: fixed;
    right: 16px;
    bottom: calc(18px + env(safe-area-inset-bottom));
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.92);
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-size: 18px;
    font-weight: 800;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 35;
  }
  .scroll-top-btn.show {
    display: flex;
  }

  /* 전체화면 상세 바텀시트/드로어 */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.72);
    backdrop-filter: blur(3px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.22s ease, visibility 0.22s ease;
    z-index: 70;
  }
  .sheet-backdrop.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  .detail-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 680px;
    margin: 0 auto;
    height: 92dvh;
    background: #111827;
    border-top: 1px solid #334155;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -16px 48px rgba(0, 0, 0, 0.75);
    transform: translateY(102%);
    visibility: hidden;
    pointer-events: none;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.28s ease;
    z-index: 80;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .detail-sheet.open {
    transform: translateY(0);
    visibility: visible;
    pointer-events: auto;
  }
  .sheet-handle {
    width: 40px;
    height: 4px;
    border-radius: 999px;
    background: #475569;
    margin: 9px auto 4px auto;
    flex-shrink: 0;
  }
  .sheet-header {
    padding: 8px 16px 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .sheet-header h2 {
    font-size: 16px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.3;
  }
  .sheet-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px 16px 28px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .map-box {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: #090e1a;
  }
  .map-box iframe {
    width: 100%;
    height: 190px;
    border: 0;
    display: block;
  }
  .map-ext-bar {
    padding: 9px 12px;
    background: #162033;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
  }
  .ext-links {
    display: flex;
    gap: 6px;
  }
  .ext-links a {
    color: #7dd3fc;
    text-decoration: none;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 7px;
    background: rgba(56, 189, 248, 0.14);
    border: 1px solid rgba(56, 189, 248, 0.35);
  }
  .sheet-section {
    background: #162033;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .sheet-section h3 {
    font-size: 13px;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .kv-list {
    display: grid;
    grid-template-columns: 78px 1fr;
    gap: 6px 8px;
    font-size: 13px;
  }
  .kv-list .k {
    color: var(--muted);
    font-weight: 700;
  }
  .kv-list .v {
    color: #f8fafc;
    word-break: keep-all;
  }
  .km-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 11px;
    border-radius: 9px;
    background: #0d1526;
    border: 1px solid #283548;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .km-card:last-child { margin-bottom: 0; }
  .sheet-nearby-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 11px;
    border-radius: 9px;
    background: #0d1526;
    border: 1px solid #283548;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .sheet-nearby-row:last-child { margin-bottom: 0; }

  .toast {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
    background: #065f46;
    color: #ecfdf5;
    border: 1px solid #10b981;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    z-index: 200;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.2s ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>
<div class="app-shell">
  <!-- 상단 고정: 타이틀 + 검색창 + 권역별 클릭창 + 세부 정렬 -->
  <header class="sticky-top">
    <div class="top-title-row">
      <h1>⛳ 중부·강원 골프장 <span class="total-pill" id="totalBadge">304개소</span> <span class="total-pill" style="background:rgba(148,163,184,0.16);color:#cbd5e1;border-color:rgba(148,163,184,0.35);">읽기 전용</span></h1>
    </div>

    <!-- 데이터 연결 상태 표시줄 (실시간 구글시트 vs 로컬 내장 데이터) -->
    <div class="data-status-bar loading" id="dataStatusBar" role="status" aria-live="polite">
      <div class="status-left">
        <span class="status-dot"></span>
        <span class="status-text" id="dataStatusText">구글시트 실시간 데이터 연결 중...</span>
      </div>
      <button type="button" class="sync-btn" id="syncLiveBtn">새로고침 ↻</button>
    </div>

    <!-- 1. 검색창 -->

function normalizeCourseItem(item) {
  const copy = { ...item };
  if (copy.num !== undefined && copy.num !== null && copy.num !== "") {
    copy.num = Number(copy.num);
  }
  if (copy.mem !== undefined && copy.mem !== null && copy.mem !== "") {
    const m = Number(copy.mem);
    copy.mem = Number.isNaN(m) ? null : m;
  } else {
    copy.mem = null;
  }
  if (copy.pub !== undefined && copy.pub !== null && copy.pub !== "") {
    const p = Number(copy.pub);
    copy.pub = Number.isNaN(p) ? null : p;
  } else {
    copy.pub = null;
  }

  if (Array.isArray(copy.keymen) && copy.keymen.length > 0) {
    copy.keymen = copy.keymen
      .map(k => ({
        name: String(k.name || "").trim(),
        role: String(k.role || "").trim(),
        mobile: String(k.mobile || "").trim()
      }))
      .filter(k => k.name || k.role || k.mobile)
      .slice(0, 3);
  } else {
    const arr = [];
    const k1Name = copy.keyman1 || copy.keyman;
    const k1Role = copy.role1 || copy.role;
    const k1Mobile = copy.mobile1 || copy.mobile;
    if (k1Name || k1Role || k1Mobile) {
      arr.push({
        name: String(k1Name || "").trim(),
        role: String(k1Role || "").trim(),
        mobile: String(k1Mobile || "").trim()
      });
    }
    if (copy.keyman2 || copy.role2 || copy.mobile2) {
      arr.push({
        name: String(copy.keyman2 || "").trim(),
        role: String(copy.role2 || "").trim(),
        mobile: String(copy.mobile2 || "").trim()
      });
    }
    if (copy.keyman3 || copy.role3 || copy.mobile3) {
      arr.push({
        name: String(copy.keyman3 || "").trim(),
        role: String(copy.role3 || "").trim(),
        mobile: String(copy.mobile3 || "").trim()
      });
    }
    copy.keymen = arr.slice(0, 3);
  }
  const first = copy.keymen[0] || { name: null, role: null, mobile: null };
  copy.keyman = first.name || null;
  copy.role = first.role || null;
  copy.mobile = first.mobile || null;

  ["region", "change", "name", "addr", "tel", "caterer", "wh", "draft", "can", "note"].forEach(field => {
    if (copy[field] !== undefined && copy[field] !== null) {
      const s = String(copy[field]).trim();
      copy[field] = s === "" ? null : s;
    } else {
      copy[field] = null;
    }
  });
  return copy;
}

let golfData = DEFAULT_GOLF_DATA.map(normalizeCourseItem);

function showToast(msg) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function formatCourseName(item) {
  return item.caterer ? `${item.name}(${item.caterer})` : item.name;
}

function formatKeymenSummary(item) {
  const list = item.keymen || [];
  if (!list.length) return "";
  return list
    .map((k, idx) => {
      const info = [k.name, k.role, k.mobile].filter(Boolean).join(" ");
      return list.length > 1 ? `[${idx + 1}] ${info}` : info;
    })
    .join(" / ");
}

function formatNowTime() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  return `${hh}:${mm}:${ss}`;
}

function setDataSourceBanner(mode, detailMsg) {
  const bar = document.getElementById("dataStatusBar");
  const textEl = document.getElementById("dataStatusText");
  const btn = document.getElementById("syncLiveBtn");
  if (!bar || !textEl) return;

  bar.classList.remove("loading", "live", "local");
  bar.classList.add(mode);

  if (mode === "loading") {
    textEl.innerHTML = `구글시트 실시간 데이터 불러오는 중...`;
    if (btn) btn.disabled = true;
  } else if (mode === "live") {
    textEl.innerHTML = `🟢 실시간 구글시트 로드됨 <span class="status-sub">(${detailMsg || formatNowTime()})</span>`;
    if (btn) btn.disabled = false;
  } else {
    textEl.innerHTML = `🟡 로컬 내장 데이터 표시 중 <span class="status-sub">(${detailMsg || "오프라인/연결 실패"})</span>`;
    if (btn) btn.disabled = false;
  }
}

function fetchViaJsonp(url, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    const cbName = "__gsheet_cb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
    const script = document.createElement("script");
    let finished = false;

    const cleanup = () => {
      if (script.parentNode) script.parentNode.removeChild(script);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
    };

    const timer = setTimeout(() => {
      if (finished) return;
      finished = true;
      cleanup();
      reject(new Error("JSONP 응답 시간 초과"));
    }, timeoutMs);

    window[cbName] = (data) => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    script.onerror = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      cleanup();
      reject(new Error("스크립트 로드 차단/실패"));
    };

    const sep = url.includes("?") ? "&" : "?";
    script.src = `${url}${sep}callback=${cbName}&_ts=${Date.now()}`;
    document.head.appendChild(script);
  });
}

async function requestSheetPayload() {
  const sep = LIVE_SHEET_API_URL.includes("?") ? "&" : "?";
  const reqUrl = `${LIVE_SHEET_API_URL}${sep}_ts=${Date.now()}`;
  try {
    const res = await fetch(reqUrl, {
      method: "GET",
      redirect: "follow"
    });
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    const text = await res.text();
    return JSON.parse(text);
  } catch (fetchErr) {
    // file:// 환경이나 일부 모바일 WebView에서 fetch가 막힐 경우 JSONP 폴백 시도
    return await fetchViaJsonp(LIVE_SHEET_API_URL, 10000);
  }
}

async function fetchLiveGolfData(isManual = false) {
  setDataSourceBanner("loading");
  try {
    const payload = await requestSheetPayload();
    const rows = Array.isArray(payload)
      ? payload
      : (Array.isArray(payload.data) ? payload.data : (Array.isArray(payload.records) ? payload.records : null));

    if (!rows || rows.length === 0) {
      throw new Error("응답 데이터가 비어 있음");
    }

    const validRows = rows
      .map(normalizeCourseItem)
      .filter(r => r.name && !Number.isNaN(r.num));

    if (validRows.length === 0) {
      throw new Error("유효한 골프장 레코드 없음");
    }

    golfData = validRows;
    const nowStr = formatNowTime();
    setDataSourceBanner("live", `${golfData.length}개소 · ${nowStr} 동기화`);
    renderList();
    if (state.sheetCourseNum !== null) {
      openDetailSheet(state.sheetCourseNum);
    }
    if (isManual) {
      showToast(`실시간 구글시트 최신 데이터(${golfData.length}개소)를 반영했습니다.`);
    }
  } catch (err) {
    console.warn("실시간 구글시트 로드 실패, 로컬 데이터로 전환:", err);
    golfData = DEFAULT_GOLF_DATA.map(normalizeCourseItem);
    const reason = err && err.message ? err.message : "연결 불가";
    setDataSourceBanner("local", `내장 ${golfData.length}개소 · ${reason}`);
    renderList();
    if (isManual) {
      showToast(`실시간 연결 실패: ${reason}`);
    }
  }
}

  { key: "남산면", coords: [37.795, 127.605] },
  { key: "서면", coords: [37.665, 127.685] },
  { key: "화도읍", coords: [37.655, 127.315] },
  { key: "기흥구", coords: [37.275, 127.115] },
  { key: "처인구", coords: [37.205, 127.245] },
  { key: "모가면", coords: [37.185, 127.455] },
  { key: "호법면", coords: [37.225, 127.415] },
  { key: "지정면", coords: [37.395, 127.845] },
  { key: "문막읍", coords: [37.315, 127.815] },
  { key: "부론면", coords: [37.215, 127.755] },
  { key: "앙성면", coords: [37.145, 127.785] }
];

const DIRECT_DRIVE_OVERRIDES = {
  "85-147": 10,
  "89-147": 11,
  "85-89": 7,
  "85-87": 8,
  "85-88": 9,
  "190-273": 8,
  "120-276": 12,
  "120-277": 13,
  "71-38": 16,
  "76-35": 17,
  "127-29": 18
};

function getCourseLatLng(course) {
  const addr = course.addr || "";
  let base = [37.35, 127.30];
  for (const [k, coords] of Object.entries(LOCALITY_COORDS)) {
    if (addr.includes(k)) {
      base = coords;
      break;
    }
  }
  for (const sub of SUB_LOCALITY_COORDS) {
    if (addr.includes(sub.key)) {
      base = sub.coords;
      break;
    }
  }
  const jLat = (((course.num * 37) % 19) - 9) * 0.0042;
  const jLng = (((course.num * 53) % 19) - 9) * 0.0048;
  return [base[0] + jLat, base[1] + jLng];
}

function extractCityName(addr) {
  if (!addr) return "";
  const m = addr.match(/([가-힣]+(?:시|군|구))/);
  return m ? m[1] : "";
}

function estimateDriveMinutes(a, b) {
  const pairKey = a.num < b.num ? `${a.num}-${b.num}` : `${b.num}-${a.num}`;
  if (DIRECT_DRIVE_OVERRIDES[pairKey] !== undefined) {
    return DIRECT_DRIVE_OVERRIDES[pairKey];
  }
  const [lat1, lon1] = getCourseLatLng(a);
  const [lat2, lon2] = getCourseLatLng(b);
  const dLat = (lat2 - lat1) * 111;
  const dLon = (lon2 - lon1) * 88.8;
  const straightKm = Math.sqrt(dLat * dLat + dLon * dLon);
  const roadKm = straightKm * 1.28 + 1.5;
  return Math.max(4, Math.round((roadKm / 46) * 60));
}

function getNearbyCoursesTop6(targetCourse, allCourses) {
  const list = [];
  allCourses.forEach(other => {
    if (other.num === targetCourse.num) return;
    const mins = estimateDriveMinutes(targetCourse, other);
    const otherCity = extractCityName(other.addr);
    list.push({ course: other, mins, otherCity });
  });
  list.sort((x, y) => x.mins - y.mins || x.course.num - y.course.num);
  return list.slice(0, 6);
}

// =========================================================================
// 앱 상태 및 필터 동기화
// =========================================================================
const state = {
  region: "ALL",
  city: "ALL",
  caterer: "ALL",
  query: "",
  sort: "region",
  highlightedNum: null,
  sheetCourseNum: null
};

function syncFilterOptions() {
  const totalCount = golfData.length;
  document.getElementById("totalBadge").textContent = `${totalCount}개소`;

  const regionCounts = { ALL: totalCount, "경기권": 0, "강원권": 0, "충청권": 0, "인천권": 0, "서울": 0 };
  const citySet = new Set();
  const catererSet = new Set();

  golfData.forEach(d => {
    if (d.region && regionCounts[d.region] !== undefined) {
      regionCounts[d.region]++;
    }
    if (state.region === "ALL" || d.region === state.region) {
      const city = extractCityName(d.addr);
      if (city) citySet.add(city);
    }
    if (d.caterer && d.caterer.trim()) {
      catererSet.add(d.caterer.trim());
    }
  });

  document.querySelectorAll("#regionGrid .region-btn").forEach(btn => {
    const reg = btn.dataset.region;
    const label = reg === "ALL" ? "전체" : reg;
    const cnt = regionCounts[reg] ?? 0;
    btn.innerHTML = `${label} <span class="cnt">(${cnt})</span>`;
  });

  const citySelect = document.getElementById("cityFilter");
  const prevCity = state.city;
  const sortedCities = Array.from(citySet).sort((a, b) => a.localeCompare(b, "ko"));
  citySelect.innerHTML = `<option value="ALL">시·군 전체</option>`;
  sortedCities.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    citySelect.appendChild(opt);
  });
  if (prevCity === "ALL" || citySet.has(prevCity)) {
    citySelect.value = prevCity;
  } else {
    state.city = "ALL";
    citySelect.value = "ALL";
  }

  const catererSelect = document.getElementById("catererFilter");
  const prevCat = state.caterer;
  const sortedCats = Array.from(catererSet).sort((a, b) => a.localeCompare(b, "ko"));
  catererSelect.innerHTML = `<option value="ALL">위탁사 전체</option><option value="NONE">위탁사 미기재</option>`;
  sortedCats.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    catererSelect.appendChild(opt);
  });
  if (prevCat === "ALL" || prevCat === "NONE" || catererSet.has(prevCat)) {
    catererSelect.value = prevCat;
  } else {
    state.caterer = "ALL";
    catererSelect.value = "ALL";
  }
}

function getFilteredAndSortedCourses() {
  const q = (state.query || "").trim().toLowerCase();
  const filtered = golfData.filter(item => {
    if (state.region !== "ALL" && item.region !== state.region) return false;
    if (state.city !== "ALL" && extractCityName(item.addr) !== state.city) return false;
    if (state.caterer === "NONE" && item.caterer) return false;
    if (state.caterer !== "ALL" && state.caterer !== "NONE" && item.caterer !== state.caterer) return false;

    if (!q) return true;
    const kmText = (item.keymen || []).map(k => `${k.name || ""} ${k.role || ""} ${k.mobile || ""}`).join(" ");
    const haystack = [
      String(item.num || ""),
      item.name,
      item.caterer,
      item.region,
      item.change,
      item.addr,
      item.tel,
      item.wh,
      item.draft,
      item.can,
      item.note,
      kmText
    ].filter(Boolean).join(" ").toLowerCase();

    return haystack.includes(q);
  });

  const sorted = [...filtered];
  if (state.sort === "name") {
    sorted.sort((a, b) => a.name.localeCompare(b.name, "ko"));
  } else if (state.sort === "num") {
    sorted.sort((a, b) => (a.num || 0) - (b.num || 0));
  } else {
    sorted.sort((a, b) => {
      const rCmp = (a.region || "").localeCompare(b.region || "", "ko");
      if (rCmp !== 0) return rCmp;
      const aCmp = (a.addr || "").localeCompare(b.addr || "", "ko");
      if (aCmp !== 0) return aCmp;
      return a.name.localeCompare(b.name, "ko");
    });
  }
  return sorted;
}

// =========================================================================
// 메인 리스트 렌더링
// =========================================================================
function renderList() {
  syncFilterOptions();
  const courses = getFilteredAndSortedCourses();
  const listEl = document.getElementById("courseList");
  const regionLabel = state.region === "ALL" ? "전체 권역" : state.region;
  document.getElementById("resultSummary").innerHTML =
    `${regionLabel} · 검색 결과 <strong>${courses.length}개소</strong>`;

  listEl.innerHTML = "";

  if (courses.length === 0) {
    listEl.innerHTML = `
      <div class="course-card" style="text-align:center; padding:28px 16px;">
        <div style="font-size:15px; font-weight:800; color:#f8fafc; margin-bottom:6px;">일치하는 골프장이 없습니다</div>
        <div style="font-size:12.5px; color:#94a3b8;">검색어를 지우거나 권역 버튼을 [전체]로 변경해 보세요.</div>
      </div>
    `;
    return;
  }

  const frag = document.createDocumentFragment();

  courses.forEach(c => {
    const card = document.createElement("article");
    card.className = "course-card" + (c.num === state.highlightedNum ? " highlighted" : "");
    card.id = `course-card-${c.num}`;

    const holes = [
      c.mem ? `회원 ${c.mem}H` : null,
      c.pub ? `대중 ${c.pub}H` : null
    ].filter(Boolean).join(" / ") || "홀 미기재";

    const beerInfo = [
      c.draft ? `Draft: ${c.draft}` : null,
      c.can ? `Can: ${c.can}` : null
    ].filter(Boolean).join(" · ");

    const keymanSummary = formatKeymenSummary(c);
    const titleHtml = c.caterer
      ? `${c.name}<span class="card-caterer">(${c.caterer})</span>`
      : c.name;

    const nearby6 = getNearbyCoursesTop6(c, golfData);
    const nearbyHtml = nearby6.map(item => {
      const nc = item.course;
      const catLabel = nc.caterer || "미기재";
      const tCls = item.mins <= 12 ? "t-fast" : (item.mins <= 22 ? "t-mid" : "t-far");
      return `
        <button type="button" class="nearby-item" data-jump-num="${nc.num}">
          <div class="nearby-name-line">${nc.name}<span class="cat">(${catLabel})</span></div>
          <div class="nearby-meta-line">
            <span class="nearby-city">${item.otherCity || nc.region}</span>
            <span class="time-pill ${tCls}">약 ${item.mins}분</span>
          </div>
        </button>
      `;
    }).join("");

    const telHtml = c.tel && c.tel !== "-" && c.tel !== "000-000-0000"
      ? `<a href="tel:${c.tel}" class="tel-link" onclick="event.stopPropagation()">${c.tel}</a>`
      : (c.tel || "-");

    card.innerHTML = `
      <div class="card-top">
        <div class="card-title"><span class="card-num">#${c.num}</span>${titleHtml}</div>
        <button type="button" class="card-detail-btn" data-detail-num="${c.num}">상세·지도</button>
      </div>

      <div class="badge-row">
        <span class="tag region">${c.region}</span>
        <span class="tag">${holes}</span>
        ${c.change && c.change !== "기존" ? `<span class="tag change">${c.change}</span>` : ""}
        ${beerInfo ? `<span class="tag beer">${beerInfo}</span>` : ""}
      </div>

      <div class="info-rows">
        <div class="info-line"><span class="info-label">주소</span><span class="info-val">${c.addr || "-"}</span></div>
        <div class="info-line"><span class="info-label">전화</span><span class="info-val">${telHtml}</span></div>
        ${c.wh ? `<div class="info-line"><span class="info-label">도매장</span><span class="info-val">${c.wh}</span></div>` : ""}
        ${keymanSummary ? `<div class="info-line"><span class="info-label">키맨(${c.keymen.length})</span><span class="info-val">${keymanSummary}</span></div>` : ""}
        ${c.note ? `<div class="info-line"><span class="info-label">메모</span><span class="info-val">${c.note}</span></div>` : ""}
      </div>

      <div class="nearby-box">
        <div class="nearby-head">
          <span>📍 인근 골프장 6곳 (차량 이동시간)</span>
          <span class="sub">터치 시 바로 이동</span>
        </div>
        <div class="nearby-grid">${nearbyHtml}</div>
      </div>
    `;

    card.addEventListener("click", () => {
      openDetailSheet(c.num);
    });

    card.querySelectorAll(".nearby-item").forEach(btn => {
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const targetNum = Number(btn.dataset.jumpNum);
        jumpToCourse(targetNum);
      });
    });

    frag.appendChild(card);
  });

  listEl.appendChild(frag);
}

function jumpToCourse(targetNum) {
  const target = golfData.find(d => d.num === targetNum);
  if (!target) return;

  state.region = "ALL";
  state.city = "ALL";
  state.caterer = "ALL";
  state.query = "";
  state.highlightedNum = targetNum;

  document.getElementById("searchInput").value = "";
  document.getElementById("searchClearBtn").classList.remove("show");
  document.querySelectorAll("#regionGrid .region-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.region === "ALL");
  });

  renderList();
  const el = document.getElementById(`course-card-${targetNum}`);
  if (el) {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  showToast(`#${target.num} ${formatCourseName(target)} 위치로 이동했습니다.`);
}

// =========================================================================
// 상세 바텀시트 (지도, 길찾기, 상세정보, 인근 6곳)
// =========================================================================
function openDetailSheet(num) {
  const course = golfData.find(d => d.num === num);
  if (!course) return;
  state.sheetCourseNum = num;
  state.highlightedNum = num;

  document.getElementById("sheetTitle").textContent = `#${course.num} ${formatCourseName(course)}`;
  const body = document.getElementById("sheetBody");

  const queryForMap = encodeURIComponent(`${course.name} ${course.addr || ""}`.trim());
  const naverUrl = `https://map.naver.com/p/search/${encodeURIComponent(course.name)}`;
  const kakaoUrl = `https://map.kakao.com/link/search/${encodeURIComponent(course.name)}`;
  const embedUrl = `https://maps.google.com/maps?q=${queryForMap}&t=&z=13&ie=UTF8&iwloc=&output=embed`;

  const holes = [
    course.mem ? `회원제 ${course.mem}홀` : null,
    course.pub ? `대중제 ${course.pub}홀` : null
  ].filter(Boolean).join(" / ") || "미기재";

  const keymen = course.keymen || [];
  const kmHtml = keymen.length
    ? keymen.map((k, idx) => `
        <div class="km-card">
          <div>
            <span style="color:#38bdf8; font-weight:800; margin-right:6px;">키맨 ${idx + 1}</span>
            <strong>${k.name || "성명 미기재"}</strong>
            <span style="color:#94a3b8; margin-left:4px;">${k.role || ""}</span>
          </div>
          <div>
            ${k.mobile ? `<a href="tel:${k.mobile}" class="tel-link">${k.mobile}</a>` : `<span style="color:#64748b;">번호 없음</span>`}
          </div>
        </div>
      `).join("")
    : `<div style="font-size:12.5px; color:#94a3b8;">등록된 키맨 정보가 없습니다.</div>`;

  const nearby6 = getNearbyCoursesTop6(course, golfData);
  const nearbyRowsHtml = nearby6.map(item => {
    const nc = item.course;
    const cat = nc.caterer || "미기재";
    const tCls = item.mins <= 12 ? "t-fast" : (item.mins <= 22 ? "t-mid" : "t-far");
    return `
      <div class="sheet-nearby-row" data-sheet-jump="${nc.num}">
        <div style="min-width:0;">
          <div style="font-size:13px; font-weight:800; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            ${nc.name} <span style="color:#38bdf8;">(${cat})</span>
          </div>
          <div style="font-size:11px; color:#94a3b8; margin-top:2px;">${nc.addr || "-"}</div>
        </div>
        <span class="time-pill ${tCls}" style="font-size:11.5px; padding:3px 7px;">약 ${item.mins}분</span>
      </div>
    `;
  }).join("");

  body.innerHTML = `
    <div class="map-box">
      <iframe src="${embedUrl}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="${course.name} 지도"></iframe>
      <div class="map-ext-bar">
        <span style="color:#cbd5e1; font-weight:600;">내비·지도 앱 열기:</span>
        <div class="ext-links">
          <a href="${naverUrl}" target="_blank" rel="noopener noreferrer">네이버지도 ↗</a>
          <a href="${kakaoUrl}" target="_blank" rel="noopener noreferrer">카카오맵 ↗</a>
        </div>
      </div>
    </div>

    <div class="sheet-section">
      <h3>기본 및 식음·주류 상세 정보</h3>
      <div class="kv-list">
        <div class="k">권역/구분</div><div class="v">${course.region} · ${course.change || "기존"}</div>
        <div class="k">위탁사</div><div class="v"><strong>${course.caterer || "미기재"}</strong></div>
        <div class="k">코스규모</div><div class="v">${holes}</div>
        <div class="k">전화번호</div><div class="v">${course.tel && course.tel !== "-" && course.tel !== "000-000-0000" ? `<a href="tel:${course.tel}" class="tel-link">${course.tel}</a>` : (course.tel || "-")}</div>
        <div class="k">도매장</div><div class="v">${course.wh || "-"}</div>
        <div class="k">Draft Beer</div><div class="v">${course.draft || "-"}</div>
        <div class="k">Can Beer</div><div class="v">${course.can || "-"}</div>
        <div class="k">주소</div><div class="v">${course.addr || "-"}</div>
        <div class="k">특이사항</div><div class="v">${course.note || "-"}</div>
      </div>
    </div>

    <div class="sheet-section">
      <h3>담당 키맨 (${keymen.length} / 3명)</h3>
      ${kmHtml}
    </div>

    <div class="sheet-section">
      <h3>인근 골프장 6곳 (차량 소요시간순)</h3>
      ${nearbyRowsHtml}
    </div>
  `;

  body.querySelectorAll(".sheet-nearby-row").forEach(row => {
    row.addEventListener("click", () => {
      const nextNum = Number(row.dataset.sheetJump);
      openDetailSheet(nextNum);
    });
  });

  document.getElementById("sheetBackdrop").classList.add("open");
  const sheet = document.getElementById("detailSheet");
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  body.scrollTop = 0;
}

function closeDetailSheet() {
  document.getElementById("sheetBackdrop").classList.remove("open");
  const sheet = document.getElementById("detailSheet");
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden", "true");
  state.sheetCourseNum = null;
}

document.getElementById("sheetCloseBtn").onclick = closeDetailSheet;
document.getElementById("sheetBackdrop").onclick = closeDetailSheet;

// =========================================================================
// 검색창, 권역 버튼, 세부 필터, 스크롤 이벤트 바인딩
// =========================================================================
const searchInputEl = document.getElementById("searchInput");
const searchClearBtn = document.getElementById("searchClearBtn");

searchInputEl.addEventListener("input", () => {
  state.query = searchInputEl.value;
  searchClearBtn.classList.toggle("show", state.query.length > 0);
  renderList();
});

searchClearBtn.addEventListener("click", () => {
  searchInputEl.value = "";
  state.query = "";
  searchClearBtn.classList.remove("show");
  renderList();
  searchInputEl.focus();
});

document.querySelectorAll("#regionGrid .region-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#regionGrid .region-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.region = btn.dataset.region;
    state.city = "ALL";
    renderList();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
});

document.getElementById("cityFilter").addEventListener("change", e => {
  state.city = e.target.value;
  renderList();
});

document.getElementById("catererFilter").addEventListener("change", e => {
  state.caterer = e.target.value;
  renderList();
});

document.querySelectorAll(".sort-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.sort = btn.dataset.sort;
    renderList();
  });
});

document.getElementById("resetFilterBtn").addEventListener("click", () => {
  state.region = "ALL";
  state.city = "ALL";
  state.caterer = "ALL";
  state.query = "";
  state.sort = "region";
  state.highlightedNum = null;
  searchInputEl.value = "";
  searchClearBtn.classList.remove("show");
  document.querySelectorAll("#regionGrid .region-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.region === "ALL");
  });
  document.querySelectorAll(".sort-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.sort === "region");
  });
  renderList();
  showToast("검색 및 권역 필터가 초기화되었습니다.");
});

const scrollTopBtn = document.getElementById("scrollTopBtn");
window.addEventListener("scroll", () => {
  scrollTopBtn.classList.toggle("show", window.scrollY > 360);
}, { passive: true });
scrollTopBtn.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("syncLiveBtn").addEventListener("click", () => {
  fetchLiveGolfData(true);
});

renderList();
fetchLiveGolfData(false);
</script>
